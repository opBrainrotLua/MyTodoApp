
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>ADD NEW TASK</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-heading">
    <h1>Create a Task</h1>
    <p>What do you need to accomplish today?</p>
  </div>

  <form (ngSubmit)="saveTask()">
    <ion-item>
      <ion-input
        label="Task Title"
        labelPlacement="floating"
        placeholder="Enter task title"
        [(ngModel)]="title"
        name="title"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Description"
        labelPlacement="floating"
        placeholder="Enter task description"
        [(ngModel)]="description"
        name="description"
        rows="5">
      </ion-textarea>
    </ion-item>

    <ion-button expand="block" type="submit" class="save-button">
      SAVE TASK
    </ion-button>
  </form>
</ion-content>
